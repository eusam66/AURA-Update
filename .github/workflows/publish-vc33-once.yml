name: Dispatch approved AURA vc33 release (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-vc33-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check release absence and hand off to verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=eusam66/AURA-Update
          if gh release view android-stable-vc33 --repo "$repo" >/dev/null 2>&1; then
            echo "vc33 already exists; refusing duplicate publication."
            exit 0
          fi
          gh workflow run publish-android.yml --repo "$repo" --ref main \
            -f channel=stable \
            -f source_run_id=41890834198 \
            -f source_artifact_name=AURA-Glass-TV-Premium-engine3-vc33 \
            -f expected_sha256=346d6db2d4b76907799e8ba580d670a0a897d692f91be50c969fc5ac9fd55243 \
            -f version_code=33 \
            -f version_name=1.0.1-aura-premium-2.1 \
            -f "release_notes=Premium 2.1 vc33 — correcoes nos Favoritos, teclados, Home, catalogos, foco e EPG; AURA Surprise e Mini Player. AURA Sync preparado localmente; ativacao remota ainda pendente. Atualizacao compativel sobre vc32, preservando dados e assinatura." 
          echo "Publisher dispatched. Verification and feed activation remain in publish-android.yml."
