name: Dispatch approved AURA vc34 release (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-vc34-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check release absence and hand off to verified publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=eusam66/AURA-Update
          if gh release view android-stable-vc34 --repo "$repo" >/dev/null 2>&1; then
            echo "vc34 already exists; refusing duplicate publication."
            exit 0
          fi
          gh workflow run publish-android.yml --repo "$repo" --ref main \
            -f channel=stable \
            -f source_run_id=41925395008 \
            -f source_artifact_name=AURA-Glass-TV-Premium-engine3-vc34 \
            -f expected_sha256=b7ee81155cd5ab2b6f46f7dce156f42eddfa53645a6bbe5e96b877d3920b753f \
            -f version_code=34 \
            -f version_name=1.0.2-aura-premium-hotfix \
            -f "release_notes=Premium vc34 — hotfix de foco D-pad no Mini Player, halo dourado alinhado e categorias de TV ao Vivo reiniciando no primeiro canal. 80 testes direcionados aprovados. Atualizacao sobre vc33, com pacote e assinatura preservados. Homologacao fisica pendente."
          echo "Publisher dispatched; release feed activates only after SHA and signing verification."
