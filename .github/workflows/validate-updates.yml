name: Validate AURA Update feeds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both Android TV update manifests
        run: python3 scripts/validate_manifest.py
      - name: Run manifest security tests
        run: python3 -m unittest discover -s tests -v
